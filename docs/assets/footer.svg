<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Let's build something reliable">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12275c"/>
      <stop offset="55%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="facc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fround"><rect width="1000" height="150" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#fround)">
    <rect width="1000" height="150" fill="url(#fbg)"/>
    <circle cx="500" cy="150" r="200" fill="url(#fglow)">
      <animate attributeName="r" values="200;230;200" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="0" width="1000" height="3" fill="url(#facc)"/>
    <text x="500" y="66" text-anchor="middle" fill="#f8fafc"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="26" font-weight="700" letter-spacing="-0.3">Let&#8217;s build something reliable.</text>
    <text x="500" y="98" text-anchor="middle" fill="#7dd3fc"
          font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13" letter-spacing="1">franzecalleja.vercel.app</text>
    <text x="500" y="124" text-anchor="middle" fill="#475569"
          font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11" letter-spacing="1.5">THANKS FOR SCROLLING</text>
  </g>
</svg>
